<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeeWeeS — What-if Scenario Simulation</title>
<style>
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --ink:#1c2733; --muted:#67788a;
    --line:#e3e9ef; --accent:#0b7285; --accent-soft:#e6f3f5;
    --good:#1f9d57; --bad:#d6453d; --warn:#c98a00;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 28px;
         display:flex;align-items:baseline;gap:14px}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:13px}
  header .mode{margin-left:auto;font-size:12px;color:var(--muted);
        border:1px solid var(--line);padding:3px 10px;border-radius:999px}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:22px;padding:22px 28px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
           margin:0 0 14px;font-weight:650;display:flex;align-items:center;gap:12px}
  .btn-export{margin-left:auto;text-transform:none;letter-spacing:0;width:auto;
        margin-top:0;padding:6px 14px;font-size:12px;background:#fff;color:var(--accent);
        border:1px solid var(--accent);border-radius:7px;cursor:pointer;font-weight:600}
  .btn-export:hover{background:var(--accent-soft)}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
  label:first-of-type{margin-top:0}
  .hint{position:relative;display:inline-block;width:14px;height:14px;line-height:14px;
        text-align:center;border-radius:50%;font-size:10px;color:var(--muted);
        border:1px solid var(--line);margin-left:4px;font-style:normal;user-select:none}
  .hint:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .hint::after{content:attr(data-tip);position:absolute;left:50%;top:150%;
        transform:translateX(-50%);width:230px;background:#1c2733;color:#fff;
        font-size:11.5px;font-weight:400;line-height:1.45;text-align:left;
        padding:8px 10px;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.18);
        opacity:0;visibility:hidden;transition:opacity .08s;z-index:50;pointer-events:none}
  .hint:hover::after{opacity:1;visibility:visible}
  @media print{ .hint{display:none} }
  input[type=range]{width:100%}
  select,input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);
        border-radius:7px;font-size:13px;background:#fff;color:var(--ink)}
  .rangeval{float:right;color:var(--ink);font-weight:600}
  button{margin-top:20px;width:100%;background:var(--accent);color:#fff;border:0;
          padding:11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .results{display:flex;flex-direction:column;gap:20px}
  /* flow */
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .node{border:1px solid var(--line);background:#fff;color:var(--muted);
        padding:7px 11px;border-radius:8px;font-size:12px;transition:.25s;white-space:nowrap}
  .node.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);
        font-weight:600;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(11,114,133,.30)}
    70%{box-shadow:0 0 0 9px rgba(11,114,133,0)}
    100%{box-shadow:0 0 0 0 rgba(11,114,133,0)}}
  .node.done{border-color:#cfe8d8;background:#f1faf4;color:var(--good)}
  .arrow{color:var(--line);font-size:13px}
  .handoff{margin-top:12px;min-height:20px;font-size:12.5px;color:var(--muted)}
  .handoff b{color:var(--ink)}
  .loopbadge{display:inline-block;margin-left:8px;font-size:11px;color:var(--warn);
        border:1px solid #f0dca8;background:#fdf6e3;padding:2px 8px;border-radius:999px}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{border:1px solid var(--line);border-radius:9px;padding:14px}
  .kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:24px;font-weight:680;margin-top:6px}
  .kpi .d{font-size:12px;margin-top:3px}
  .d.up{color:var(--bad)} .d.flat{color:var(--muted)} .d.down{color:var(--good)}
  .bars{margin-top:16px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
  .bar-row span:first-child{width:74px;color:var(--muted)}
  .track{flex:1;background:#eef2f5;border-radius:6px;height:16px;overflow:hidden}
  .fill{height:100%;border-radius:6px}
  .fill.base{background:#9fb5c2} .fill.scen{background:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  pre{white-space:pre-wrap;background:#fbfcfd;border:1px solid var(--line);
      border-radius:8px;padding:12px;font-size:12px;color:#33414f;margin:0;max-height:260px;overflow:auto}
  .prose{font-size:13px;color:#33414f}
  .prose h4{font-size:12.5px;color:var(--accent);margin:14px 0 6px;font-weight:650}
  .prose h4:first-child{margin-top:0}
  .prose p{margin:6px 0}
  .prose ul{margin:6px 0 6px 0;padding-left:18px}
  .prose li{margin:4px 0}
  .prose .esc{color:var(--bad)}
  iframe{width:100%;height:430px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>SeeWeeS</h1>
  <span class="sub">What-if Scenario Simulation — 48h dispatch decision sandbox</span>
  <span class="mode" id="mode">…</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>Scenario builder</h2>
    <label>Demand spike
      <span class="hint" data-tip="Inflates shipment volume by this %. e.g. 35% = 35% more units to move in the 48h window — stress-tests fleet capacity.">i</span>
      <span class="rangeval" id="demandv">0%</span></label>
    <input type="range" id="demand" min="0" max="100" step="5" value="0">

    <label>Close a corridor / warehouse
      <span class="hint" data-tip="Shuts that lane: its shipments can't dispatch and become stranded (penalized). C1 = Tier-1 Boston (6h SLA), C2 = Tier-2 Philadelphia (12h).">i</span></label>
    <select id="closure">
      <option value="">(none)</option>
      <option value="C1_I95_NJ_BOS">C1 — NJ → Boston (I-95)</option>
      <option value="C2_NJ_PHL">C2 — NJ → Philadelphia</option>
    </select>

    <label>Drivers / day
      <span class="hint" data-tip="Shared driver pool per day. Each truck needs one driver — too few drivers strands units even if trucks are available.">i</span></label>
    <input type="number" id="driver" value="6" min="0" max="20">
    <label>Standard trucks / day
      <span class="hint" data-tip="Room-temperature truck fleet per day. Capacity ~10 units each (+10% packing buffer).">i</span></label>
    <input type="number" id="std" value="4" min="0" max="20">
    <label>Temp-controlled trucks / day
      <span class="hint" data-tip="Reefer fleet for cold-chain medicine (e.g. insulin, biologics). Usually the binding constraint — lower it to simulate a reefer shortage.">i</span></label>
    <input type="number" id="reefer" value="2" min="0" max="20">

    <label>Weather override — corridor
      <span class="hint" data-tip="Pick a corridor to force a weather risk on, or (none) for normal forecast logic.">i</span></label>
    <select id="wxc">
      <option value="">(none)</option>
      <option value="C1_I95_NJ_BOS">C1 — I-95</option>
      <option value="C2_NJ_PHL">C2 — Philadelphia</option>
    </select>
    <label>Forced weather risk score
      <span class="hint" data-tip="Severity 0–3 for the chosen corridor: 0 none · 1 = +10% travel buffer · 2 = +25% · 3 = +40% + escalation. Higher = less effective truck capacity on that lane.">i</span>
      <span class="rangeval" id="wxv">0</span></label>
    <input type="range" id="wxs" min="0" max="3" step="1" value="0">

    <button id="run">Run simulation</button>
    <p class="muted" id="status" style="margin-top:14px"></p>
  </div>

  <div class="results">
    <div class="card">
      <h2>Multi-agent workflow — live run</h2>
      <div class="flow" id="flow"></div>
      <div class="handoff" id="handoff"></div>
    </div>
    <div id="output">
      <div class="card empty">Configure a scenario and click <b>Run simulation</b>.</div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
